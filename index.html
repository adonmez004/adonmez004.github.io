<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Demos · Frontendmentor Solutions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live demos of solutions for frontendmentor.io challenges.">
  <meta name="theme-color" content="#0C0E12">
  <style>
    :root {
      color-scheme: light dark;

      --bg: light-dark(#f7f7f8, #0c0e12);
      --surface: light-dark(#ffffff, #15181e);
      --border: light-dark(#e3e4e8, #262a33);
      --text: light-dark(#14161b, #e8e9ec);
      --muted: light-dark(#5d6170, #9aa0ad);
      --accent: light-dark(#2c5fd8, #7aa2ff);

      --radius: 0.75rem;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-block-size: 100dvh;
      padding: 3rem 1rem;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
    }

    main {
      max-inline-size: 45rem;
      margin-inline: auto;
    }

    header {
      margin-block-end: 2.5rem;
    }

    .site-link {
      color: var(--muted);
      font-size: 0.875rem;
      text-decoration: none;
    }

    .site-link:hover {
      color: var(--accent);
    }

    h1 {
      margin-block: 0.75rem 0.5rem;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      line-height: 1.2;
    }

    .lead {
      color: var(--muted);
    }

    ul {
      display: grid;
      gap: 0.75rem;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background-color: var(--surface);
    }

    h2 {
      font-size: 1.125rem;
    }

    h2 a {
      color: inherit;
      text-decoration: none;
    }

    h2 a:hover {
      color: var(--accent);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-block-start: 0.5rem;
      font-size: 0.875rem;
    }

    .links a {
      color: var(--accent);
    }

    footer {
      margin-block-start: 3rem;
      color: var(--muted);
      font-size: 0.875rem;
    }

    footer a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a class="site-link" href="https://frontendmentorsolutions.io/">← frontendmentorsolutions.io</a>
      <h1>Demos</h1>
      <p class="lead">Live demos of solutions for frontendmentor.io challenges.</p>
    </header>

    <ul>
      <!-- Each solution is one <li>. Copy this block for new demos. -->
      <li>
        <h2><a href="/qr-code-component/">QR Code Component</a></h2>
        <div class="links">
          <a href="/qr-code-component/">Live demo</a>
          <a href="https://github.com/adonmez004/qr-code-component">Code</a>
          <a href="https://frontendmentorsolutions.io/qr-code-component/">Read the solution</a>
        </div>
      </li>
    </ul>

  </main>
</body>
</html>
